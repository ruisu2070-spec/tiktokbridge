<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Liteの招待</title>
  <style>
    body { font: 1rem/1.6 system-ui, sans-serif; text-align: center; margin: 18vh 1rem; }
    a { display: inline-block; padding: .8rem 1.5rem; background: #171717; color: white; border-radius: .7rem; }
  </style>
</head>
<body>
  <h1>TikTok Liteの招待</h1>
  <a id="invite" href="https://lite.tiktok.com/t/ZS9f2DFeePyfP-42Tc8/">TikTok Liteを開く</a>
  <script>
    const invite = document.getElementById("invite").href;
    const agent = navigator.userAgent;
    if (/iPhone|iPad|iPod/i.test(agent) && /Barcelona/i.test(agent)) {
      window.location.href = "barcelona://extbrowser/?url=" + encodeURIComponent(invite);
    }
  </script>
</body>
</html>
